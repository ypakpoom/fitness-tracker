<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log — Info</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark"></span><h1>Log</h1></div>
    <nav class="nav-tabs">
      <a href="index.html">Workout</a>
      <a href="nutrition.html">Nutrition</a>
      <a href="info.html" class="active">Info</a>
    </nav>
  </div>

  <main>
    <div class="day-header" style="border-bottom:none; margin-bottom:8px; padding-bottom:0;">
      <div>
        <p class="eyebrow">ข้อมูลส่วนตัว</p>
        <h2>Info</h2>
        <p class="sub">บันทึกน้ำหนัก/ส่วนสูง ระบบจะคำนวณเป้าหมายโภชนาการให้ใหม่อัตโนมัติ</p>
      </div>
    </div>

    <!-- Auto-calculated summary -->
    <p class="section-title">ค่าที่คำนวณได้ตอนนี้</p>
    <div class="macro-grid" id="calcGrid">
      <div class="macro-card">
        <div class="lbl">BMR</div>
        <div class="val"><span id="calcBmr">—</span> <small>kcal/วัน</small></div>
      </div>
      <div class="macro-card">
        <div class="lbl">TDEE</div>
        <div class="val"><span id="calcTdee">—</span> <small>kcal/วัน</small></div>
      </div>
      <div class="macro-card calories">
        <div class="lbl">เป้าหมายแคลอรี</div>
        <div class="val"><span id="calcTarget">—</span> <small>kcal/วัน</small></div>
      </div>
      <div class="macro-card protein">
        <div class="lbl">โปรตีน</div>
        <div class="val"><span id="calcProtein">—</span> <small>g/วัน</small></div>
      </div>
    </div>
    <p class="target-strip" id="calcNote">—</p>

    <!-- Profile settings -->
    <p class="section-title">ข้อมูลโปรไฟล์</p>
    <div class="add-food" id="settingsForm">
      <div class="row">
        <div class="macro-input" style="flex:1; min-width:110px;">
          <label>เพศ</label>
          <select id="sGender">
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
          </select>
        </div>
        <div class="macro-input" style="width:100px;">
          <label>อายุ (ปี)</label>
          <input type="number" id="sAge" min="10" max="100">
        </div>
        <div class="macro-input" style="width:120px;">
          <label>ส่วนสูง (ซม.)</label>
          <input type="number" id="sHeight" min="100" max="230">
        </div>
      </div>
      <div class="row">
        <div class="macro-input" style="flex:1; min-width:220px;">
          <label>ระดับกิจกรรม</label>
          <select id="sActivity"></select>
        </div>
        <div class="macro-input" style="flex:1; min-width:180px;">
          <label>เป้าหมาย</label>
          <select id="sGoal"></select>
        </div>
      </div>
      <button class="btn" id="saveSettingsBtn">บันทึกโปรไฟล์</button>
    </div>

    <!-- Body log -->
    <p class="section-title">บันทึกน้ำหนัก / มวลกาย</p>
    <div class="add-food">
      <div class="row">
        <div class="macro-input" style="width:150px;">
          <label>วันที่</label>
          <input type="date" id="bDate">
        </div>
        <div class="macro-input" style="width:110px;">
          <label>น้ำหนัก (กก.)</label>
          <input type="number" id="bWeight" min="20" max="300" step="0.1">
        </div>
        <div class="macro-input" style="width:130px;">
          <label>ไขมันในร่างกาย (%)</label>
          <input type="number" id="bFat" min="0" max="70" step="0.1" placeholder="ถ้ามี">
        </div>
      </div>
      <div class="row">
        <input type="text" id="bNote" placeholder="โน้ต (ถ้ามี)" style="flex:1;">
      </div>
      <button class="btn" id="addBodyBtn">+ บันทึกวันนี้</button>
    </div>

    <p class="section-title">ประวัติ</p>
    <div id="bodyLogList"></div>
  </main>

  <script src="info.js"></script>
</body>
</html>
